<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>라벨 스캔 가이드</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="라벨 가이드">
<meta name="theme-color" content="#3643BA">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* 매장에서 서서 한 손으로 보는 화면: 흰 바탕, 검은 글씨, 강조색 하나, 큰 글씨. */
:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --band: #F2F4F7;
  --ink: #111111;
  --sub: #3A434D;
  --line: #C5CDD6;
  --accent: #3643BA;
  --on-accent: #FFFFFF;
  --good: #0B6B2B;
  --warn-bg: #FFF1CC;
  --warn-ink: #5C3A00;
  --bad: #A32014;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: 17px; line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
h1, h2, h3, p, ul, dl, dd { margin: 0; }
ul { padding: 0; list-style: none; }
.wrap { max-width: 600px; margin: 0 auto; padding: 14px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 22px; font-weight: 800; line-height: 1.25; }
h2 { font-size: 20px; font-weight: 800; line-height: 1.3; }
h3 { font-size: 17px; font-weight: 700; line-height: 1.35; }
.sub { color: var(--sub); font-size: 15px; }
.tag { font-size: 14px; font-weight: 700; color: var(--accent); }

button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; cursor: pointer; min-height: 52px; padding: 10px 16px; background: var(--band); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
button.primary { background: var(--accent); color: var(--on-accent); }
button.line { background: var(--bg); border: 2px solid var(--ink); min-height: 44px; padding: 6px 14px; font-size: 15px; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 메인 */
.topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.searchbox { display: flex; flex-direction: column; gap: 8px; }
.searchbox label { font-size: 18px; font-weight: 800; }
.searchbox input { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--ink); background: var(--bg); color: var(--ink); min-height: 56px; }
.examples { display: flex; gap: 8px; flex-wrap: wrap; }
.examples button { min-height: 40px; padding: 6px 12px; font-size: 14px; font-weight: 500; border: 1.5px solid var(--line); background: var(--bg); text-align: left; }
.shoot { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.shoot button { min-height: 64px; font-size: 18px; }
.status { font-size: 16px; font-weight: 700; padding: 10px 12px; border-radius: 10px; background: var(--band); }
.badge { display: inline-block; font-size: 14px; font-weight: 800; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--good); color: var(--good); }
.badge.no { border-color: var(--bad); color: var(--bad); }
.badge.unk { border-color: var(--sub); color: var(--sub); }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; min-height: 44px; }
.toggle input { width: 26px; height: 26px; accent-color: var(--accent); }
.status.err { background: var(--warn-bg); color: var(--warn-ink); }
.block { display: flex; flex-direction: column; gap: 10px; }
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; width: 100%; background: var(--bg); border-top: 1.5px solid var(--line); border-radius: 0; padding: 12px 0; text-align: left; min-height: 0; font-weight: 700; }
.item:first-child { border-top: 0; }
.item .nm { display: flex; flex-direction: column; min-width: 0; }
.item .nm small { color: var(--sub); font-weight: 400; font-size: 14px; }
.item .pr { font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
.th { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--band); display: block; }
.th.big { width: 76px; height: 76px; }
.pimg { width: 100%; max-height: 300px; object-fit: contain; background: var(--band); border-radius: 12px; display: block; }
.edit { border: 2px dashed var(--ink); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.edit label { font-size: 15px; font-weight: 800; }
.edit input, .edit textarea { width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
.edit textarea { min-height: 84px; resize: vertical; }
.cats { display: flex; gap: 8px; flex-wrap: wrap; }
.cats button { min-height: 44px; padding: 6px 14px; font-size: 16px; }
.cats button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* 추천 카드 */
.rec { border: 2px solid var(--ink); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.rec .head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.rec .rank { font-size: 14px; font-weight: 800; color: var(--accent); }
.say { background: var(--accent); color: var(--on-accent); border-radius: 12px; padding: 14px; font-size: 19px; font-weight: 700; line-height: 1.5; }
.say small { display: block; font-size: 13px; font-weight: 700; opacity: .9; margin-bottom: 4px; letter-spacing: .02em; }
.why li { display: grid; grid-template-columns: 24px 1fr; gap: 4px; font-size: 17px; }
.why li::before { content: "✓"; font-weight: 800; color: var(--good); }
.minus li::before { content: "△"; color: var(--bad); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.note { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; font-size: 15px; font-weight: 500; }

/* 제품 화면 */
.phead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.phead h2 { font-size: 21px; }
.price { font-size: 24px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pick { border: 3px solid var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.pick p { font-size: 18px; font-weight: 500; }
.tryit { background: var(--band); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.tryit p { font-size: 17px; }
.next li { font-size: 18px; padding: 8px 0; border-top: 1.5px solid var(--line); }
.next li:first-child { border-top: 0; }
.jump { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.jump button { min-height: 44px; padding: 6px 14px; font-size: 15px; white-space: nowrap; flex: 0 0 auto; border: 2px solid var(--ink); background: var(--bg); }
details.acc { border: 2px solid var(--line); border-radius: 12px; }
details.acc[open] { border-color: var(--ink); }
details.acc > summary { list-style: none; cursor: pointer; padding: 14px; display: grid; grid-template-columns: 1fr 24px; gap: 4px 8px; align-items: center; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary .t { font-size: 18px; font-weight: 800; }
details.acc > summary .pv { grid-column: 1; font-size: 15px; color: var(--sub); }
details.acc > summary::after { content: "＋"; grid-column: 2; grid-row: 1 / span 2; font-size: 22px; font-weight: 800; text-align: center; }
details.acc[open] > summary::after { content: "－"; }
.acc .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.lab { font-size: 15px; font-weight: 800; color: var(--accent); }
.kv { display: grid; grid-template-columns: minmax(84px, auto) 1fr; gap: 6px 12px; font-size: 16px; }
.kv dt { color: var(--sub); }
.kv dd { font-weight: 500; }
.alt { border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.alt.me { border: 2px solid var(--accent); }
.rich { display: flex; flex-direction: column; gap: 8px; font-size: 16px; border-top: 1.5px dashed var(--line); padding-top: 12px; }
.rich h4 { margin: 6px 0 0; font-size: 16px; font-weight: 800; }
.rich li { display: grid; grid-template-columns: 14px 1fr; gap: 4px; }
.rich li::before { content: "·"; font-weight: 800; }
.ocr { font-size: 14px; white-space: pre-wrap; max-height: 140px; overflow: auto; background: var(--band); padding: 8px; border-radius: 8px; }
footer { font-size: 14px; color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <div id="home" class="block" style="gap:16px">
    <header class="topbar">
      <h1>라벨 스캔 가이드</h1>
      <button class="line" id="upd" type="button">업데이트 확인</button>
    </header>
    <p class="sub" id="ver">자료를 불러오는 중입니다. 처음에는 10~20초 걸릴 수 있습니다.</p>
    <p class="status" id="updMsg" role="status" hidden></p>

    <section class="searchbox" aria-label="검색창">
      <label for="q">검색창</label>
      <input id="q" type="search" placeholder="제품명·코드 또는 고객 질문 입력" autocomplete="off">
      <div class="examples" id="examples"></div>
    </section>

    <div class="cats" id="sports" hidden></div>
    <label class="toggle" id="gyWrap" hidden><input type="checkbox" id="gy"><span id="gyLabel">고양점에서 파는 제품만 보기</span></label>

    <section class="shoot" aria-label="라벨 스캔">
      <button class="primary" id="scanBtn" type="button">라벨 촬영</button>
      <button id="pickBtn" type="button">사진 선택</button>
    </section>
    <p class="status" id="status" role="status" hidden></p>
    <details id="ocrBox" hidden><summary class="sub">읽은 글자 보기</summary><div class="ocr" id="ocrText"></div></details>

    <section class="block" id="recBlock" hidden>
      <h2 id="recTitle">고객 질문에 맞는 추천</h2>
      <p class="sub" id="recSub"></p>
      <div class="cats" id="recChips" style="margin:8px 0"></div>
      <div class="block" id="recs"></div>
    </section>

    <section class="block" id="resBlock" hidden>
      <h2 id="resTitle">검색 결과</h2>
      <div class="list" id="res"></div>
    </section>

    <section class="block" id="editBlock" hidden>
      <h2 id="editCount">이 휴대폰에서 수정한 제품</h2>
      <p class="sub">수정 내용은 이 휴대폰에만 저장됩니다. 목록을 복사해 관리자에게 보내면, 관리자가 반영한 뒤 모든 휴대폰에 업데이트됩니다.</p>
      <div class="row"><button class="primary" id="editCopy" type="button" style="min-height:44px">수정 목록 복사</button></div>
    </section>

    <section class="block" id="catBlock">
      <h2>종류별로 보기</h2>
      <div class="cats" id="cats"></div>
      <div class="list" id="catList"></div>
    </section>

    <footer>제품 정보와 가격은 자료 작성 시점 기준입니다. 고객에게는 라벨에 적힌 가격으로 안내하세요. 경쟁사 제품의 가격과 사양은 시점에 따라 다를 수 있습니다.</footer>
  </div>

  <div id="detail" class="block" hidden style="gap:14px">
    <button class="line" id="backBtn" type="button" style="align-self:flex-start">← 목록으로</button>
    <div id="result" class="block" style="gap:14px"></div>
  </div>
</div>

<script>
window.onerror = function (msg, src, line) {
  try {
    var s = document.getElementById("status");
    if (s) { s.hidden = false; s.className = "status err"; s.textContent = "화면 오류: " + msg + " (" + line + "행). 이 문구를 관리자에게 알려 주세요."; }
  } catch (e) {}
};
(() => {
  const N = window.Native || null;
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const arr = (v) => (Array.isArray(v) ? v : []);
  const str = (v) => (v == null ? "" : String(v).trim());
  const won = (n) => (typeof n === "number" && n > 0 ? n.toLocaleString("ko-KR") + "원" : "");
  const priceOf = (p) => won(p.price) + (p.priceMax && p.priceMax > p.price ? "~" : "");
  const norm = (s) => String(s).toLowerCase().replace(/[^0-9a-z가-힣]+/g, "");
  const toks = (s) => [...new Set(String(s).toLowerCase().split(/[^0-9a-z가-힣]+/).filter((t) => t.length >= 2))];
  const copyText = (text, btn, label) => {
    const ok = () => { btn.textContent = "복사했습니다"; setTimeout(() => (btn.textContent = label), 1500); };
    const fail = () => { btn.textContent = "복사하지 못했습니다"; setTimeout(() => (btn.textContent = label), 1500); };
    try {
      if (N) { N.copy(text); ok(); }
      else navigator.clipboard.writeText(text).then(ok, fail);
    } catch (_) { fail(); }
  };
  const thumb = (p, cls) => {
    if (!str(p.image)) { return el("span", "th" + (cls ? " " + cls : "")); }
    const img = el("img", "th" + (cls ? " " + cls : ""));
    img.loading = "lazy";
    img.alt = "";
    img.src = p.image + "?format=auto&f=200x200";
    img.onerror = () => { img.style.visibility = "hidden"; };
    return img;
  };
  /* 직원 수정: 이 기기에 저장하고, 목록을 복사해 관리자에게 보낸다 */
  let EDITS = {};
  try { EDITS = JSON.parse(localStorage.getItem("lsg.edits") || "{}") || {}; } catch (_) { EDITS = {}; }
  const saveEdits = () => { try { localStorage.setItem("lsg.edits", JSON.stringify(EDITS)); } catch (_) {} renderEdits(); };
  const editOf = (p) => EDITS[p.id] || null;
  const pointsOf = (p) => { const e = editOf(p); if (e && arr(e.points).filter(str).length) return e.points.filter(str); return p.easy ? p.easy.points : arr(p.key_points || p.points0).slice(0, 3); };
  const diffOf = (p) => { const e = editOf(p); if (e && str(e.diff)) return str(e.diff); return p.diff ? p.diff.diff : (p.easy ? p.easy.better : ""); };
  function renderEdits() {
    const ids = Object.keys(EDITS);
    const box = $("editBlock");
    if (!box) return;
    box.hidden = ids.length === 0;
    $("editCount").textContent = "이 휴대폰에서 수정한 제품 " + ids.length + "개";
  }
  function editsAsText() {
    const lines = ["[라벨 스캔 가이드 수정 요청] 자료 " + str(DB.version)];
    for (const id of Object.keys(EDITS)) {
      const e = EDITS[id];
      const p = DB.products.find((x) => x.id === id);
      lines.push("", "■ " + (p ? str(p.name) : "제품") + " (번호 " + id + ")");
      arr(e.points).filter(str).forEach((t, n) => lines.push("좋은 점 " + (n + 1) + ": " + str(t)));
      if (str(e.diff)) lines.push("다른 점: " + str(e.diff));
      if (str(e.note)) lines.push("틀린 정보·메모: " + str(e.note));
    }
    return lines.join("\n");
  }

  let DB = { version: "", products: [] };
  let codeMap = new Map();
  let idf = new Map();
  let activeCat = "";
  let onlyStore = true;
  try { onlyStore = localStorage.getItem("lsg.onlyStore") !== "0"; } catch (_) {}
  let sport = "";
  try { sport = localStorage.getItem("lsg.sport") || ""; } catch (_) {}
  const inStore = (p) => (!sport || p.sport === sport) && (!onlyStore || !DB.store || p.goyang === 1);
  function renderSports() {
    const list = arr(DB.sports);
    const box = $("sports");
    box.hidden = list.length < 2;
    box.replaceChildren();
    if (list.length < 2) return;
    if (sport && !list.includes(sport)) sport = "";
    [""].concat(list).forEach((sp) => {
      const b = el("button", null, sp || "전체");
      b.type = "button";
      b.setAttribute("aria-pressed", String(sport === sp));
      b.onclick = () => {
        sport = sp;
        try { localStorage.setItem("lsg.sport", sp); } catch (_) {}
        activeCat = "";
        renderSports();
        renderCats();
        if (norm($("q").value).length >= 2) runSearch($("q").value);
      };
      box.append(b);
    });
  }
  const storeBadge = (p) => {
    if (!DB.store) return null;
    if (p.goyang === 1) return el("span", "badge", "고양점 판매");
    if (p.goyang === 0) return el("span", "badge no", "고양점 미판매");
    return el("span", "badge unk", "고양점 판매 여부 확인 안 됨");
  };

  /* ---------- 자료 ---------- */
  async function loadData() {
    try {
      const r = await fetch("data.json?t=" + Date.now());
      const d = await r.json();
      if (!d || !Array.isArray(d.products)) throw new Error("bad data");
      DB = d;
    } catch (_) { $("ver").textContent = "자료를 불러오지 못했습니다"; return; }
    codeMap = new Map();
    const df = new Map();
    DB.products.forEach((p, i) => {
      arr(p.codes).forEach((c) => codeMap.set(String(c), i));
      p._tok = toks(str(p.name) + " " + str(p.brand));
      p._norm = norm(str(p.name) + str(p.brand));
      p._tok.forEach((t) => df.set(t, (df.get(t) || 0) + 1));
      p._kind = str(p.cat) + " " + str(p.name);
      const plain = (p.easy ? [p.easy.hook].concat(p.easy.points, [p.easy.better]) : []).concat(p.diff ? [p.diff.when, p.diff.diff] : []);
      p._hi = [str(p.name), str(p.pitch)].concat(arr(p.key_points), plain).join(" ");
      p._blob = norm(p._hi + " " + str(p.cat) + " " + str(p.target_customer));
      p._kid = kidOf(p);
      p._part = partOf(p);
      p._season = p._part ? seasonOf(p, p._hi) : "";
      p._nc = norm(str(p.name) + " " + str(p.cat));
      p._nn = norm(str(p.name));
      p._cho = choOf(p._nn);
      p._acc = ACC_NAME.test(str(p.name));
      p._lo = [str(p.target_customer), str(p.script)].concat(arr(p.specs).map((s) => str(s.label) + " " + str(s.value))).join(" ");
    });
    buildVocab(df);
    idf = new Map();
    df.forEach((n, t) => idf.set(t, Math.log(DB.products.length / n) + 1));
    DB.products.forEach((p) => { p._w = p._tok.reduce((a, t) => a + idf.get(t), 0) || 1; });
    $("ver").textContent = "자료 " + str(DB.version) + " · 제품 " + DB.products.length + "개" + (DB.store ? " · 고양점 판매 " + DB.products.filter((p) => p.goyang === 1).length + "개 (" + str(DB.store.checked) + " 확인)" : "");
    renderSports();
    $("gyWrap").hidden = !DB.store;
    $("gy").checked = onlyStore;
    renderCats();
  }

  /* ---------- 라벨·이름 찾기 ---------- */
  function matchLabel(text) {
    const exact = new Map();
    const cands = [];
    for (const line of String(text).split("\n")) {
      cands.push(...(line.match(/\d{6,13}/g) || []));
      cands.push(...(line.replace(/[\s.\-]/g, "").match(/\d{6,13}/g) || []));
    }
    for (const c of cands) if (codeMap.has(c)) exact.set(codeMap.get(c), c);
    const T = norm(text);
    const scored = [];
    DB.products.forEach((p, i) => {
      let hit = 0, n = 0;
      for (const t of p._tok) if (T.includes(t)) { hit += idf.get(t); n++; }
      if (!n) return;
      let score = (hit * hit) / p._w;
      if (p.price && T.includes(String(p.price))) score *= 1.4;
      const cover = hit / p._w;
      if (cover >= 0.45 || n >= 3) scored.push({ i, score, cover });
    });
    scored.sort((a, b) => b.score - a.score);
    const out = [];
    exact.forEach((code, i) => out.push({ p: DB.products[i], why: "코드 " + code + " 일치", exact: true }));
    for (const s of scored) {
      if (out.length >= 6) break;
      if (exact.has(s.i)) continue;
      out.push({ p: DB.products[s.i], why: "이름 " + Math.round(s.cover * 100) + "% 일치", exact: false });
    }
    return out;
  }
  function searchName(q) {
    const nq = norm(q);
    const cq = String(q).replace(/\s+/g, "");
    if (isCho(cq)) {
      // Initial consonants only, e.g. "ㄹㄴㅎ" finds 러닝화.
      const hit = DB.products.filter((p) => inStore(p) && p._cho.includes(cq));
      hit.sort((a, b) => (b.reviews || 0) - (a.reviews || 0));
      return hit.slice(0, 20).map((x) => ({ p: x, why: "초성 일치" }));
    }
    if (nq.length < 2) return [];
    const qt = toks(q);
    const out = [];
    DB.products.forEach((p) => {
      if (!inStore(p)) return;
      let score = 0;
      if (p._norm.includes(nq)) score = 100;
      else {
        const hits = qt.filter((t) => p._norm.includes(t)).length;
        if (qt.length && hits === qt.length) score = 60;
        else if (qt.length >= 2 && hits >= 2) score = 20 * hits / qt.length;
      }
      if (/^\d{4,}$/.test(nq) && arr(p.codes).some((c) => String(c).startsWith(nq))) score = 120;
      if (score >= 20) out.push({ p, score });
    });
    const accQ = ACC_NAME.test(String(q));
    const inN = (o) => (o.p._nn.includes(nq) ? 1 : 0);
    const acc = (o) => (!accQ && o.p._acc ? 1 : 0);
    out.sort((a, b) => acc(a) - acc(b) || inN(b) - inN(a) || b.score - a.score || (b.p.reviews || 0) - (a.p.reviews || 0));
    return out.slice(0, 20).map((o) => ({ p: o.p, why: "" }));

  let zxing = null;
  const loadZxing = () => zxing || (zxing = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js";
    sc.onload = () => res(window.ZXing);

  async function webScan(file) {
    if (!file) return;
    window.__scanStart();
    const url = URL.createObjectURL(file);
    try {
      const Z = await loadZxing();
      const reader = new Z.BrowserMultiFormatReader();
      const result = await reader.decodeFromImageUrl(url);
      window.__scan(result && result.text ? result.text : null);
    } catch (_) {
      setStatus("바코드를 읽지 못했습니다. 바코드가 화면에 크게, 또렷하게 나오도록 다시 찍거나 검색창에 제품명을 입력해 주세요.", true);
    } finally {
      URL.revokeObjectURL(url);
    }
  }

    inp.style.cssText = "position:fixed;left:-1000px;top:0;opacity:0";
    inp.onchange = () => { const f = inp.files && inp.files[0]; inp.remove(); webScan(f); };

  };

    $("examples").append(b);
  });

  const UPD = { checking: "새 자료가 있는지 확인하는 중입니다…", updated: "새 자료로 업데이트했습니다.", latest: "최신 자료입니다.", offline: "지금은 확인할 수 없어 저장된 자료를 사용합니다." };
  window.__updateStatus = (s) => {
    const m = $("updMsg");
    m.hidden = false;
    m.textContent = UPD[s] || "";
    if (s === "updated") loadData();
    if (s !== "checking") setTimeout(() => { m.hidden = true; }, 4000);
  };
  $("upd").onclick = () => { if (N) N.refresh(); else { window.__updateStatus("checking"); loadData().then(() => window.__updateStatus("latest")); } };

  loadData();
})();
</script>
</body>
</html>
